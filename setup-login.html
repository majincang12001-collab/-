<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次设置漫剧工坊登录口令</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f6fb;margin:0;padding:24px;color:#182033}.card{max-width:460px;margin:10vh auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 36px #18203318}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:1px solid #ccd3df;border-radius:10px;font-size:16px}button{background:#225de6;color:white;border:0;font-weight:600}small{color:#667085}.status{margin-top:12px;white-space:pre-wrap}</style><div class="card"><h2>首次设置工作台登录口令</h2><p>正式服务器此前没有安装登录凭证。请在这里设置你自己的新口令。</p><input id="a" type="password" autocomplete="new-password" placeholder="新口令（8—128位）"><input id="b" type="password" autocomplete="new-password" placeholder="再次输入新口令"><button id="save">保存并启用登录</button><div class="status" id="s"></div><small>此初始化入口只允许通过工作台的安全本地连接使用。</small></div><script>document.getElementById('save').onclick=async()=>{const a=document.getElementById('a').value,b=document.getElementById('b').value,s=document.getElementById('s');if(a.length<8||a.length>128){s.textContent='口令长度必须为8—128位';return}if(a!==b){s.textContent='两次输入不一致';return}const btn=document.getElementById('save');btn.disabled=true;s.textContent='正在安全保存…';try{const r=await fetch('/api/setup/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_key:a})});const j=await r.json();if(!r.ok)throw Error(j.error||'保存失败');document.getElementById('a').value='';document.getElementById('b').value='';s.textContent='口令设置成功！现在返回工作台首页，使用刚才设置的口令登录。';}catch(e){s.textContent='设置失败：'+e.message;}finally{btn.disabled=false}};</script></html>
